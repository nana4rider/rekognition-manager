pre-commit:
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,json,md,yml,yaml}'
      run: npx prettier --check {staged_files}
    eslint:
      glob: '*.{ts,tsx,js,jsx}'
      run: npx eslint --max-warnings 0 {staged_files}
    lint:
      run: npm run lint
    openapi:
      run: npm run openapi:generate && git add -- docs/openapi.json

pre-push:
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm test
